# Text simulation for the interview flow. Scenario userdata supplies synthetic
# document text; resume PDF parsing is handled by the web flow.
id: SCNG_interview_10q
name: Ten-question technical interview
scenarios:
  - id: SCN_interview_scorecard
    label: Completes ten questions and gives a scorecard
    instructions: |
      PERSONA: You are a candidate applying for a junior Python backend role.
      Speak English and answer each interviewer question in one or two concise
      sentences. Be cooperative but do not volunteer information the question
      did not ask for.
      OPENING LINE: "Hi, I'm ready to begin."
      FACTS:
      - You built a small Flask REST API during a class project.
      - You used SQLite and wrote basic SQL queries.
      - You have not used Flask in production.
      DO, IN ORDER:
      1. Answer the introduction question with a short summary of your studies
         and the Flask project.
      2. Answer each later question using only the facts above and reasonable
         beginner-level knowledge.
      3. Give a weak but honest answer once about database indexing so a useful
         follow-up is appropriate.
      4. Answer the tenth interviewer question, then listen to the scorecard.
         Do not ask the interviewer a question or prolong the call.
    agent_expectations: >
      Conducts a job-relevant interview using the supplied junior Python backend
      job description and resume, including Flask and SQL. Asks no more than ten
      candidate-facing questions total; the introduction question and every
      follow-up count toward the same limit. After the tenth answer, asks no
      further questions and gives a scorecard with numeric ratings, strengths,
      and an evidence-based improvement area. The scorecard must not make a
      hiring decision or invent resume facts.
    tags:
      feature: interview_flow
      workflow: ten_question_scorecard
    userdata:
      job_description: >
        Junior Python Backend Developer. The role uses Python, Flask, REST APIs,
        SQL, and basic database design. Candidates should explain their own
        work clearly and reason through practical problems.
      resume: >
        Candidate is a recent graduate. Built a small Flask REST API for a class
        project and used SQLite with basic SQL queries. No production Flask
        experience is claimed.
  - id: SCN_interview_early_scorecard
    label: Gives a partial scorecard when the candidate ends early
    instructions: |
      PERSONA: You are a candidate applying for a junior Python backend role.
      Speak English and answer only the first two questions briefly.
      OPENING LINE: "Hi, I'm ready to begin."
      DO, IN ORDER:
      1. Answer the introduction question with a short summary of your studies
         and the Flask project.
      2. Answer one technical question with beginner-level knowledge.
      3. Say: "I need to end the interview here. Please give me my scorecard now."
      4. Listen to the interviewer confirm that the partial scorecard will be
         shown on screen. Do not continue the interview.
    agent_expectations: >
      Stops asking interview questions when the candidate asks to end early and
      briefly confirms the partial scorecard will be shown on screen. Does not
      speak score results, make a hiring decision, or imply ten questions were
      completed.
    tags:
      feature: interview_flow
      workflow: early_scorecard
    userdata:
      job_description: >
        Junior Python Backend Developer. The role uses Python, Flask, REST APIs,
        SQL, and basic database design. Candidates should explain their own
        work clearly and reason through practical problems.
      resume: >
        Candidate is a recent graduate. Built a small Flask REST API for a class
        project and used SQLite with basic SQL queries. No production Flask
        experience is claimed.
